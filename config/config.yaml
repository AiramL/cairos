environment: "cairos_vtc"

datasets:
        CIFAR-10: 
                classes: 10
                features: 
                        height: 32
                        width: 32
                        channels: 3
        CIFAR-100:
                classes: 100
                features:
                        height: 32
                        width: 32
                        channels: 3
        
        MNIST: 
                classes: 10
                features: 
                        height: 28
                        width: 28
                        channels: 1
        FMNIST:
                classes: 10
                features: 
                        height: 28
                        width: 28
                        channels: 1
        SIGN: 
                classes: 43
                features: 
                        height: 32
                        width: 32
                        channels: 3
simulation:
        cars: 50
        map: "Manhattan"
        data_type: "throughput"
        mobility:
                distance:
                        x: 2000
                        y: 2000       
                repetitions: 10
        communication:
                repetitions: 30
        speed:
                index: 
                        - 0
                value:
                        - 13.88889 # 50 km/h
        federated_learning:
                framework: "torch"
                data:
                        alpha: "5.0"
                server:
                        ip: "127.0.0.1"
                        port: "8081"
                        timeout: 50
                        rounds: 15
                        n_clients_fit: 10
                        strategy: "cairos_pe"
                        epochs_distribution: "equal"
                client:
                        model: "RESNET10"
                        epochs: 10
                        dataset: "CIFAR-10"
        base_station:
                range: 10000
                positions: "communication/base_stations.csv"

